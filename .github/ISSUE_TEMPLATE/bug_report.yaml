name: iPad port bug report
description: Report an issue specific to OpenRCT2 Touch on iPadOS.
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Use this tracker only for the OpenRCT2 Touch iPad port. Report general
        OpenRCT2 bugs upstream. Never attach proprietary RCT2 game data.

  - type: input
    attributes:
      label: OpenRCT2 Touch build
      description: Provide the Git commit or the version and build number from the app.
      placeholder: e.g. commit 1befb134 or 0.1.0 (3)
    validations:
      required: true

  - type: input
    attributes:
      label: Device and iPadOS
      placeholder: e.g. 12.9-inch M2 iPad Pro, iPadOS 26.0
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Input method
      multiple: true
      options:
        - Fingers
        - Mouse or trackpad
        - Hardware keyboard
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Game-data source
      options:
        - RollerCoaster Tycoon 2
        - RollerCoaster Tycoon Classic
        - Not applicable
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened?
      description: Describe the expected behavior and what occurred instead.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch a scenario
        2. Open the footpath tool
        3. ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Safe attachments
      description: Add screenshots, recordings, or crash logs. Do not upload proprietary game data.
    validations:
      required: false
